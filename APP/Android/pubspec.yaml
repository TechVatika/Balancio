name: balancio
description: "Your money, in balance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
    - family: Rasa
      fonts:
        - asset: assets/fonts/Rasa-Regular.ttf
    - family: NotoSerifGujarati
      fonts:
        - asset: assets/fonts/NotoSerifGujarati-Regular.ttf
        - asset: assets/fonts/NotoSerifGujarati-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifGujarati-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifGujarati-Bold.ttf
          weight: 700
